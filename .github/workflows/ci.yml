name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # v2 測試本身純標準庫，但 pytest 是執行器，需先裝（否則 python -m pytest 會 No module named pytest）
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # AGENTS.md 必須與 CLAUDE.md 同步（SSOT 把關，漂移則 fail）
      - name: Check AGENTS.md is in sync with CLAUDE.md
        run: python tools/sync_agents_md.py --check

      # 全測試套件（純標準庫 + pytest，無第三方依賴）：v2 引擎、工具、overlay、enforcement…
      - name: Run full test suite
        run: python -m pytest tests/ -q
        env:
          PYTHONPATH: .

  # ConPTY 只在 Windows 上存在，而 verify 跑 ubuntu——內嵌終端機的整個存在理由
  # （desktop/conpty.py 的 ctypes ConPTY 路徑）在 Linux CI 上一行都跑不到。
  # 這個 job 補上那塊回歸保護；公開 repo 的 Actions 分鐘數不計費，成本為零。
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: PTY 後端測試（ConPTY 路徑）
        run: python -m pytest tests/test_conpty.py -q
        env:
          PYTHONPATH: .

  # ── 雲端 auto-fix loop 的觸發點（來源：gs-harness templates/github-workflows）──
  # main 紅燈 → 開一張帶 auto-fix label 的 issue（body 含 @claude）→ claude-fix.yml
  # 接手修復開 PR → claude-review.yml 審查 → auto-merge.yml 啟用 native auto-merge。
  # 只在 main 自己壞掉時開 issue；PR 的失敗在 PR 上就看得到，不該洗版 issue tracker。
  open-issue-on-failure:
    needs: [verify, verify-windows]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failed on main @ ${sha}`,
              body: [
                `Tests failed on \`main\` at ${context.sha}.`,
                ``,
                `Failing run: ${runUrl}`,
                ``,
                `@claude please investigate the failing tests in the run above and open a PR that fixes them. Keep the change minimal and add/adjust tests where it makes the regression harder to reintroduce.`,
              ].join('\n'),
              labels: ['auto-fix', 'ci-failure'],
            });
